<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EuroPlan - Organizador de Viajes</title>

    <!-- PWA Meta -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png" />

    <!-- Tailwind CDN (solo si no lo compilás con PostCSS) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fuente -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        overscroll-behavior-y: contain;
      }

      .animate-fade-in {
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>

  <body>

    <div id="root"></div>

    <!-- IMPORTANTE: este archivo debe existir dentro de assets -->
    <script type="module" src="/EuroPlan/assets/index.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/EuroPlan/sw.js').catch(err => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>

  </body>
</html>
